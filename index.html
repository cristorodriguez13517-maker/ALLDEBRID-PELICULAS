<script>
/* LOGOS DE BANNER: conservar el color original; los logos oscuros monocromos se muestran en blanco. */
function configurarLogoBanner(img, url){
  // TMDB puede servir logos sin cabeceras CORS: no usar canvas ni crossOrigin,
  // porque eso puede bloquear la propia imagen. Los logos oscuros ya llegan
  // convertidos a blanco desde el actualizador y conservan su transparencia.
  const logoUrl=String(url||'').trim()
    .replace('https://image.tmdb.org/pw780/','https://image.tmdb.org/t/p/w780/')
    .replace('https://image.tmdb.org/t/pw780/','https://image.tmdb.org/t/p/w780/')
    .replace('http://image.tmdb.org/pw780/','https://image.tmdb.org/t/p/w780/');
  img.onload=()=>{
    img.style.filter='drop-shadow(0 1px 2px rgba(0,0,0,.45))';
  };
  img.onerror=()=>{
    img.style.filter='none';
    img.dataset.logoError='true';
  };
  img.removeAttribute('crossorigin');
  img.src=logoUrl;
}
</script>

let turnstileReject = null;

async function prepararTurnstile(){
    const limite = Date.now() + 15000;
    while(!window.turnstile && Date.now() < limite){
        await new Promise(resolve=>setTimeout(resolve,100));
    }
    if(!window.turnstile) throw new Error('No se pudo cargar la verificación anti-bots.');
    const host = document.getElementById('turnstile-container') || (() => {
        const node=document.createElement('div');
        node.id='turnstile-container';
        node.style.cssText='position:fixed;left:-10000px;top:-10000px;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none;border:0;padding:0;margin:0';
        document.body.appendChild(node);
        return node;
    })();
    if(turnstileWidgetId === null){
        turnstileWidgetId=window.turnstile.render(host,{
            sitekey:TURNSTILE_SITE_KEY,
            action:'reproducir',
            execution:'execute',
            size:'invisible',
            appearance:'interaction-only',
            callback:token=>{
                if(turnstileResolve){const done=turnstileResolve;turnstileResolve=null;turnstileReject=null;done(token);}

            'error-callback':code=>{

}

    return new Promise((resolve,reject)=>{
        turnstileResolve=resolve;
        turnstileReject=reject;
        window.turnstile.reset(turnstileWidgetId);
        window.turnstile.execute(turnstileWidgetId);
        setTimeout(()=>{
            if(turnstileReject===reject){
                turnstileResolve=null;turnstileReject=null;
                reject(new Error('La verificación está tardando demasiado. Vuelve a intentarlo.'));
            }
        },30000);
    });
}

let tokenTurnstileCache = '';
let tokenTurnstileAt = 0;
let tokenTurnstilePromise = null;
let reproduccionEnCurso = false;
const TOKEN_TURNSTILE_MAX_AGE = 210000;
const TOKEN_TURNSTILE_RENEW_AFTER = 150000;

function precalentarTokenTurnstile(){
    if(document.hidden) return Promise.resolve('');
    if(tokenTurnstileCache && Date.now()-tokenTurnstileAt < TOKEN_TURNSTILE_MAX_AGE) return Promise.resolve(tokenTurnstileCache);
    if(tokenTurnstilePromise) return tokenTurnstilePromise;
    tokenTurnstileCache = '';
    tokenTurnstileAt = 0;
    tokenTurnstilePromise = generarTokenTurnstile().then(token=>{
        if(typeof token !== 'string' || !token) throw new Error('Cloudflare no devolvió un token válido.');
        tokenTurnstileCache=token;
        tokenTurnstileAt=Date.now();
        return token;
    }).catch(error=>{
        console.warn('No se pudo anticipar la verificación; se solicitará al reproducir:',error);
        return '';
    }).finally(()=>{tokenTurnstilePromise=null;});
    return tokenTurnstilePromise;
}

async function obtenerTokenTurnstile(){
    if(tokenTurnstileCache && Date.now()-tokenTurnstileAt < TOKEN_TURNSTILE_MAX_AGE){
        const token=tokenTurnstileCache;
        tokenTurnstileCache='';
        tokenTurnstileAt=0;
        return token;
    }
    tokenTurnstileCache='';
    tokenTurnstileAt=0;
    return await precalentarTokenTurnstile() || await generarTokenTurnstile();
}

/* PREPARACIÓN ANTICIPADA DEL ENLACE: solo el elemento enfocado/seleccionado */
const enlacesDirectosPreparados=new Map();
let colaPreparacionEnlaces=Promise.resolve();
let temporizadorPrecarga=null;
let clavePrecargaProgramada='';
const EDAD_ENLACE_PREPARADO=90000;

function claveEnlace(tipo,registro){
    return String(tipo)+'|'+String(registro?.magnet_id||'')+'|'+String(registro?.file_path||'');
}
function limpiarTurnstileTrasPreparacion(){
    if(window.turnstile&&turnstileWidgetId!==null)window.turnstile.reset(turnstileWidgetId);
}
function obtenerEnlaceDirecto(tipo,registro){
    const key=claveEnlace(tipo,registro);
    const actual=enlacesDirectosPreparados.get(key);
    if(actual?.promise)return actual.promise;
    if(actual?.url&&Date.now()-actual.creado<EDAD_ENLACE_PREPARADO)return Promise.resolve(actual.url);

    const trabajo=colaPreparacionEnlaces.then(async()=>{
        const token=await obtenerTokenTurnstile();
        const response=await fetch(WORKER_URL,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                tipo,
                magnet_id:String(registro?.magnet_id||''),
                file_path:String(registro?.file_path||''),
                token
            })
        });
        const result=await response.json().catch(()=>({}));
        if(!response.ok||!result.url)throw new Error(result.error||'No se pudo preparar la reproducción.');
        return result.url;
    });
    colaPreparacionEnlaces=trabajo.then(
        ()=>limpiarTurnstileTrasPreparacion(),
        ()=>limpiarTurnstileTrasPreparacion()
    );
    enlacesDirectosPreparados.set(key,{promise:trabajo,creado:Date.now()});
    trabajo.then(url=>{
        enlacesDirectosPreparados.set(key,{url,creado:Date.now()});
    },()=>{
        enlacesDirectosPreparados.delete(key);
    });
    return trabajo;
}
function programarPrecarga(tipo,registro,inmediata=false){
    if(!registro?.magnet_id||!registro?.file_path)return;
    const key=claveEnlace(tipo,registro);
    const actual=enlacesDirectosPreparados.get(key);
    if(actual?.promise||(actual?.url&&Date.now()-actual.creado<EDAD_ENLACE_PREPARADO))return;
    clearTimeout(temporizadorPrecarga);
    clavePrecargaProgramada=key;
    temporizadorPrecarga=setTimeout(()=>{
        if(clavePrecargaProgramada!==key)return;
        obtenerEnlaceDirecto(tipo,registro).catch(error=>{
            console.warn('Precarga de enlace no completada:',error);
        });
    },inmediata?0:300);
}

async function reproducirConWorker(tipo,registro){
    if(reproduccionEnCurso) return;
    const magnetId=String(registro?.magnet_id||'');
    const filePath=String(registro?.file_path||'');
    if(!/^\d+$/.test(magnetId)||!filePath){
        alert('Este título no tiene un archivo disponible en AllDebrid.');
        return;
    }
    statusElement.hidden = false;
    statusElement.textContent = 'Verificando seguridad y preparando reproducción…';
    reproduccionEnCurso=true;
    try{
        const url=await obtenerEnlaceDirecto(tipo,registro);
        if(window.__sharkRecordWorker)window.__sharkRecordWorker(tipo,registro,url);
        abrirVLC(url);
    }catch(error){
        console.error('Error de reproducción:',error);
        alert(error.message||'No se pudo iniciar la reproducción.');
    }finally{
        reproduccionEnCurso=false;
        statusElement.hidden = true;
        if(window.turnstile&&turnstileWidgetId!==null){
            window.turnstile.reset(turnstileWidgetId);
        }
        }
}

/* ELEGIR UNA SOLA COPIA: 4K > 1080p/FHD > 720p > otras */
function puntuacionCalidad(item){
    const texto=[
        item.quality_manual,item.quality,item.file_path,item.file_name,
        item.filename,item.source_name,item.title,item.name
    ].filter(Boolean).join(' ').toLowerCase();
    if(/\b4k\b|2160p|uhd/.test(texto))return 4;
    if(/1080p|full[ ._-]?hd|\bfhd\b/.test(texto))return 3;
    if(/720p|\bhd\b/.test(texto))return 2;
    if(/480p|576p|sd/.test(texto))return 1;
    return 0;
}
function claveContenido(item){
    const tipo=item._type||'movie';
    const id=item.tmdb_id||item.id;
    if(id)return tipo+':tmdb:'+String(id);
    const titulo=normalizarTexto(titleOf(item));
    const anio=yearOf(item);
    return tipo+':title:'+titulo+':'+anio;
}
function deduplicarCatalogo(items){
    const elegidos=new Map();
    for(const item of items){
        const key=claveContenido(item);
        const anterior=elegidos.get(key);
        if(!anterior){
            elegidos.set(key,item);
            continue;
        }
        const qa=puntuacionCalidad(anterior), qb=puntuacionCalidad(item);
        const reproducibleA=!!streamOf(anterior);
        const reproducibleB=!!streamOf(item);
        const fechaA=fechaOrden(anterior),fechaB=fechaOrden(item);
        if(qb>qa || (qb===qa && reproducibleB&&!reproducibleA) ||
           (qb===qa && reproducibleB===reproducibleA && fechaB>fechaA)){
            elegidos.set(key,item);
        }
    }
    return [...elegidos.values()];
}

/* FECHA DE INCORPORACIÓN */

function fechaOrden(item){

    const campos = [

        'added_at',
        'addedAt',
        'date_added',
        'dateAdded',
        'created_at',
        'createdAt',
        'added_date',
        'magnet_date',
        'imported_at',
        'published_at'

    ];

    for(const campo of campos){

        if(!item[campo])continue;

        const fecha = new Date(item[campo]).getTime();

        if(!Number.isNaN(fecha)){
            return fecha;
        }

    }

    return 0;

}


/* DATOS DE PELÍCULAS Y SERIES */

function titleOf(item){

    return item.title_manual ||
        item.title ||
        item.youtube_title ||
        item.name ||
        'Sin título';

}


function yearOf(item){

    const date = item.release_date || item.first_air_date;

    if(date){
        return String(date).slice(0,4);
    }

    if(item.year){
        return String(item.year);
    }

    const text = [
        item.youtube_title,
        item.title,
        item.name
    ].filter(Boolean).join(' ');

    const match = text.match(/\b(19\d{2}|20\d{2})\b/);

    return match ? match[1] : '';

}


function runtimeOf(item){

    const runtime = Number(
        item.runtime ||
        item.duration_minutes ||
        0
    );

    if(!runtime || runtime <= 0)return '';

    const hours = Math.floor(runtime / 60);

    const minutes = runtime % 60;

    if(hours && minutes){
        return hours + 'h ' + minutes + 'm';
    }

    if(hours){
        return hours + 'h';
    }

    return minutes + 'm';

}


function genresOf(item){

    if(Array.isArray(item.genres)){

        return item.genres.map(genre=>{

            if(typeof genre === 'string'){
                return genre;
            }

            return genre && genre.name ? genre.name : '';

        }).filter(Boolean).join(', ');

    }

    if(typeof item.genres === 'string'){
        return item.genres;
    }

    return item.genre || item.genre_label || '';

}


function qualityOf(item){

    return item.quality_manual ||
        item.quality ||
        '';

}


function ageOf(item){

    let age =
        item.age_rating_manual ||
        item.age_rating ||
        item.age_certification ||
        item.certification ||
        '';

    if(age && !String(age).endsWith('+')){
        age = String(age) + '+';
    }

    return age;

}


function posterOf(item){

    return item.poster_manual ||
        item.poster ||
        '';

}


function logoOf(item){

    return item.logo_manual ||
        item.logo ||
        item.movie_logo ||
        '';

}


function bannerOf(item){

    return item.backdrop_manual ||
        item.backdrop ||
        '';

}


function streamOf(item){

    return item.stream_url_manual ||
        item.stream_url ||
        item.url ||
        '';

}


/* ABRIR VLC EN ANDROID */

function abrirVLC(url){

    if(!url){

        alert('No hay enlace de reproducción disponible.');

        return;

    }

    try{

        const media = new URL(url);

        if(
            media.protocol !== 'https:' &&
            media.protocol !== 'http:'
        ){

            alert('El enlace de reproducción no es válido.');

            return;

        }

        const intent =
            'intent://' +
            media.host +
            media.pathname +
            media.search +
            '#Intent;scheme=' +
            media.protocol.replace(':','') +
            ';package=org.videolan.vlc;type=video/*;end';

        window.location.href = intent;

    }catch(error){

        console.error('Error abriendo VLC:',error);

        alert('No se pudo abrir el enlace en VLC.');

    }

}

        const matches = !query || text.includes(query);

        // Aplicar el ocultamiento también directamente en el estilo inline.
        // Esto evita que cualquier regla CSS del diseño fuerce display:block
        // y vuelva a mostrar portadas que no coinciden con la búsqueda.
        card.hidden = !matches;
        if (matches) {
            card.style.removeProperty('display');
            card.removeAttribute('aria-hidden');
        } else {
            card.style.setProperty('display', 'none', 'important');
            card.setAttribute('aria-hidden', 'true');
        }

        if (matches && !firstMatch) firstMatch = card;
    });

    sharkVisibleCards = cards.filter(card => !card.hidden);
    sharkLastFocusedRow = -1;

    if (selectedMovie) selectedMovie.classList.remove('selected');
    selectedMovie = null;

    if (firstMatch) {
        statusElement.hidden = true;
    } else if (query) {
        limpiarBanner();
        statusElement.hidden = false;
        statusElement.textContent = 'No se han encontrado contenidos.';
    } else {
        statusElement.hidden = cards.length === 0;
        if (cards.length) {
            const statusMessage = statusElement.textContent || '';
            if (statusMessage === 'No se han encontrado contenidos.') statusElement.textContent = '';
        }
    }
}


/* CLICS DEL CATÁLOGO: delegación para ratón, táctil y mando */


/* La tarjeta que recibe foco o toque se prepara antes de reproducir */
function prepararTarjetaCatalogo(event,inmediata=false){
    const card=event.target.closest('.movie');
    if(!card||!movieRow.contains(card)||card.dataset.type!=='movie')return;
    const item=catalog.find(entry=>entry._type==='movie'&&
        String(entry.id||entry.tmdb_id||'')===String(card.dataset.id||''));
    if(item)programarPrecarga('movie',item,inmediata);
}
movieRow.addEventListener('pointerdown',event=>prepararTarjetaCatalogo(event,true));

movieRow.addEventListener('click',event=>{

    const card = event.target.closest('.movie');

    if(!card || !movieRow.contains(card)) return;

    event.preventDefault();

    if(card.dataset.type === 'shortcut'){
        window.location.href = 'https://cristorodriguez13517-maker.github.io/PELICULAS/';
        return;
    }

    const item = catalog.find(entry =>
        entry._type === card.dataset.type &&
        String(entry.id || entry.tmdb_id || '') === String(card.dataset.id || '')
    );

    if(!item) {
        alert('No se han podido identificar los datos de este título. Recarga la página.');
        return;
    }

    selectMovie(card);

    if(card.dataset.type === 'series') {
        abrirSerie(item);
    } else {
        reproducirConWorker('movie',item);
    }

});

/* EVENTOS DEL BUSCADOR */

searchButton.addEventListener('click',openSearch);

searchInput.addEventListener('input',filterCatalog);

searchInput.addEventListener('blur', () => {
    if (!searchInput.value.trim()) {
        searchInput.classList.remove('active');
    }
});


/* NAVEGACIÓN CON MANDO ANDROID TV */

document.addEventListener('keydown',event=>{

    const key = event.key;

    const code = event.keyCode || event.which;


    const up =
        key === 'ArrowUp' ||
        code === 38 ||
        code === 19;

    const down =
        key === 'ArrowDown' ||
        code === 40 ||
        code === 20;

    const left =
        key === 'ArrowLeft' ||
        code === 37 ||
        code === 21;

    const right =
        key === 'ArrowRight' ||
        code === 39 ||
        code === 22;

    const enter =
        key === 'Enter' ||
        code === 13 ||
        code === 23 ||
        code === 66;

    const back =
        key === 'Escape' ||
        code === 27 ||
        code === 4;


    const active = document.activeElement;

    const isSearchInput = active === searchInput;

    const isSearchButton = active === searchButton;


    /* CUANDO ESTAMOS ESCRIBIENDO */

    if(isSearchInput){

        if(back){

            event.preventDefault();

            closeSearch();

            return;

        }

        if(up){

            event.preventDefault();

            searchButton.focus({preventScroll:true});

            return;

        }

        if(down || enter){

            event.preventDefault();

            selectFirstSearchResult();

            return;

        }

        return;

    }


    /* ICONO DEL BUSCADOR */

    if(isSearchButton){

        if(enter){

            event.preventDefault();

            openSearch();

            return;

        }

        if(down){

            event.preventDefault();

            firstCard();

            return;

        }

        if(up || left || right){

            event.preventDefault();

            return;

        }

    }


    /* TARJETA ACTIVA */

    const activeCard = active && active.closest
        ? active.closest('.movie')
        : null;


    if(!activeCard){

        if(up || left){

            event.preventDefault();

            searchButton.focus({preventScroll:true});

        }else if(down || right){

            event.preventDefault();

            firstCard();

        }

        return;

    }


    const cards = visibleCards();

    const index = cards.indexOf(activeCard);


    if(index < 0){

        event.preventDefault();

        firstCard();

        return;

    }


    const cols = columns();

    let next = index;


    /* ENTER */

    if(enter){

        event.preventDefault();

        if(activeCard.dataset.type === 'shortcut'){
            window.location.href = 'https://cristorodriguez13517-maker.github.io/PELICULAS/';
            return;
        }

        if(activeCard.dataset.type === 'series'){

            const item = catalog.find(x=>
                String(x.id || x.tmdb_id) === String(activeCard.dataset.id) &&
                x._type === 'series'
            );

            if(item){

                abrirSerie(item);

            }

        }else{

            const movieItem = catalog.find(x =>
                x._type === 'movie' &&
                String(x.tmdb_id || x.id || '') === String(activeCard.dataset.id || '')
            );
            if(movieItem) reproducirConWorker('movie',movieItem);

        }

        return;

    }


    /* ATRÁS */

    if(back){

        event.preventDefault();

        searchButton.focus({preventScroll:true});

        return;

    }


    /* DERECHA */

    if(right){

        next = Math.min(index + 1,cards.length - 1);

    }


    /* IZQUIERDA */

    else if(left){

        next = index > 0 ? index - 1 : index;

    }


    /* ABAJO */

    else if(down){

        next = Math.min(index + cols,cards.length - 1);

    }


    /* ARRIBA */

    else if(up){

        if(index < cols){

            event.preventDefault();

            searchButton.focus({preventScroll:true});

            return;

        }

        next = index - cols;

    }else{

        return;

    }


    event.preventDefault();

    if(cards[next]){

        focusCard(cards[next]);

    }

},true);



/* REDIMENSIONAR */

window.addEventListener('resize',()=>{

    if(selectedMovie && !selectedMovie.hidden){

        selectMovie(selectedMovie);

    }

});


/* INICIAR SHARKTV */

async function iniciar(){

    await loadCatalog();

    requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
            const firstContent=visibleCards().find(card=>card.dataset.type!=='shortcut');
            if(firstContent)renderMovieHeader(firstContent);
        });
    });

}


iniciar();

<style id="sharktv-mobile-first-row-fade">
@media screen and (max-width:600px) and (orientation:portrait){
 .movie-row .movie{transition:opacity .12s linear,transform .12s linear!important}
}
</style>
<script id="sharktv-mobile-first-row-fade-script">
(function(){
 const mq=window.matchMedia('(max-width:600px) and (orientation:portrait)');
 let raf=0, observer=null, bound=new WeakSet();
 function getRows(){
  return Array.from(document.querySelectorAll('#movie-row, #series-grid, .movie-row'));
 }
 function getCards(){
  const rows=getRows();
  const cards=[];
  rows.forEach(row=>{
   Array.from(row.children).forEach(card=>{
    if(!cards.includes(card)) cards.push(card);
   });
  });
  return cards;
 }
 function getSynopsis(){
  return document.querySelector('#overview, .overview, #header-info .synopsis, #header-info .description, #header-info p, #header-info .description-text')
      || document.querySelector('#header-info');
 }
 function update(){
  raf=0;
  const cards=getCards();
  if(!mq.matches){
   cards.forEach(card=>{
    card.style.removeProperty('opacity');
    card.style.removeProperty('transition');
    card.style.removeProperty('pointer-events');
   });
   return;
  }
  const synopsis=getSynopsis();
  if(!synopsis)return;
  const boundary=synopsis.getBoundingClientRect().top;
  const hideBefore=300;
  cards.forEach(card=>{
   const bottom=card.getBoundingClientRect().bottom;
   // Ocultación inmediata al entrar en el límite configurado antes de la sinopsis.
   const visible=bottom>boundary+hideBefore?1:0;
   card.style.setProperty('transition','none');
   card.style.setProperty('opacity',String(visible),'important');
   card.style.setProperty('pointer-events',visible===0?'none':'auto');
  });
 }
 function request(){
  if(!raf)raf=requestAnimationFrame(update);
 }
 function bindScroll(){
  window.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('touchmove',request,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('scroll',request,{passive:true});
  getRows().forEach(row=>{
   if(!bound.has(row)){row.addEventListener('scroll',request,{passive:true});bound.add(row);}
  });
 }
 function init(){
  bindScroll();
  if(observer)observer.disconnect();
  observer=new MutationObserver(()=>{bindScroll();request();});
  observer.observe(document.body,{childList:true,subtree:true,characterData:true});
  if(window.ResizeObserver){
   const ro=new ResizeObserver(request);
   const synopsis=getSynopsis();
   if(synopsis)ro.observe(synopsis);
   getRows().forEach(row=>ro.observe(row));
  }
  request();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
 else init();
 if(mq.addEventListener)mq.addEventListener('change',request);
 else mq.addListener(request);
 window.addEventListener('resize',request,{passive:true});
})();
</script>

<style>
/* Alinear el texto del banner con la primera caratula visible */
.header-info,#header-info{
  left:var(--banner-info-left,15px)!important;
  right:15px!important;
}
</style>
<script>
(function(){
  function alignBannerInfo(){
    const header=document.querySelector('.header');
    const info=document.querySelector('.header-info,#header-info');
    const first=document.querySelector('.movie-row .movie:not([hidden]),#movie-row .movie:not([hidden]),#series-grid .movie:not([hidden])');
    if(!header||!info||!first)return;
    const headerRect=header.getBoundingClientRect();
    const cardRect=first.getBoundingClientRect();
    const left=Math.max(0,cardRect.left-headerRect.left);
    info.style.setProperty('--banner-info-left',left+'px');
  }
  let raf=0;
  function schedule(){
    if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;alignBannerInfo();});
  }
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('load',schedule,{once:true});
  const observer=new MutationObserver(schedule);
  function start(){
    observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['hidden','class']});
    schedule();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>
